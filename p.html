<head>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #player_id, #error-image {
            width: 100%;
            height: 100%;
            --op-accent-color: #fff;
        }
        .op-progressbar-container.op-clear, .op-live-badge {
            display: none !important;
        }
        .op-live-text,
        .op-setting-title,
        .op-context-item-text,
        .op-setting-item-title,
        .op-setting-item-value,
        .op-setting-item-nexticon {
            font-family: 'Pretendard', sans-serif;
        }
        #error-image {
            display: none;
            object-fit: cover;
            transform: translateZ(0);
        }
    </style>
</head>
